# Local infrastructure for Drift.
#   docker compose up -d            -> redis + mongodb (+ optional coturn)
# Then:
#   cd backend && cp .env.example .env && npm install && npm run dev
#   cd frontend && npm install && npm run dev
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local TURN relay for testing NAT traversal.
  # Un-comment and adjust `listening-ip` to your machine's public IP,
  # then map TURN_URL=turn:<your-host>:3478 in backend/.env
  # coturn:
  #   image: coturn/coturn:latest
  #   restart: unless-stopped
  #   command: [
  #     "-v", "2",
  #     "--no-tls",
  #     "--min-port", "49152",
  #     "--max-port", "65535",
  #     "use-auth-secret",
  #     "static-auth-secret=REPLACE_WITH_64_HEX_CHARS",
  #     "use-alt-auth-secret",
  #     "api-auth-secret=REPLACE_WITH_64_HEX_CHARS",
  #     "static-auth-secret=REPLACE_WITH_64_HEX_CHARS",
  #     "use-auth-secret"
  #   ]
  #   ports:
  #     - "3478:3478/udp"
  #     - "3478:3478/tcp"
  #     - "49152-65535:49152-65535/udp"

  # Optional: run the backend in Docker too.
  # backend:
  #   build: ./backend
  #   restart: unless-stopped
  #   ports:
  #     - "10000:10000"
  #   environment:
  #     NODE_ENV: production
  #     PORT: "10000"
  #     FRONTEND_URL: http://localhost:5173
  #     REDIS_URL: redis://redis:6379
  #     MONGODB_URI: mongodb://mongodb:27017/drift
  #     HASH_SALT: replace-with-a-long-random-string
  #     ADMIN_API_KEY: replace-with-a-long-random-string
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_healthy

volumes:
  redis-data:
  mongo-data:
